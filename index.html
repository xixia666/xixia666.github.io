<style>
:root{--bg:#222325;--text:#fff;--muted:rgba(255,255,255,.6)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;color:var(--text)}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ============ INTRO ============ */
.content-intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
.content-intro .content-inner{position:relative;z-index:2;text-align:center}
.content-intro .fade{opacity:0}
.content-title{font-size:2.8rem;font-weight:700;letter-spacing:.02em;margin-bottom:.5rem;opacity:0}
.content-subtitle{font-size:1.1rem;font-weight:300;color:var(--muted);opacity:0}
.enter{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:2.5rem;cursor:pointer;opacity:0;transition:opacity .4s ease}
.enter:hover{opacity:.8}
.enter span{font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.arrow{width:1px;height:30px;background:var(--muted);position:relative;overflow:hidden}
.arrow-1{animation:arrowFlow 1.5s infinite ease-in-out}
.arrow-2{animation:arrowFlow 1.5s .3s infinite ease-in-out}
@keyframes arrowFlow{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

#background{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block}
.shape-wrap{position:fixed;bottom:0;left:0;width:100%;z-index:3;pointer-events:none}
.shape-wrap svg{display:block;width:100%}
.shape-wrap path{fill:var(--bg)}

/* GitHub corner */
.github-corner{position:fixed;top:0;right:0;z-index:10;opacity:0}
.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}
@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}
@media(max-width:500px){.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}

/* ============ MAIN ============ */
.content-main{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0}
.content-main .fade{opacity:0}
#card{position:relative;text-align:center;padding:40px 30px;border-radius:20px}
#card::before{content:'';position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.card-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
#card img{width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,255,255,.15);object-fit:cover}
#card h1{font-size:1.6rem;font-weight:600;letter-spacing:.01em}
#card h2{font-size:.95rem;font-weight:300;color:var(--muted)}
#card ul{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center}
#card li a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 20px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);min-width:80px;transition:all .3s ease}
#card li a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);transform:translateY(-4px)}
#card li a:active{transform:scale(.97)}
#card li a svg{width:28px;height:28px;fill:var(--text);opacity:.9}
#card li a span{font-size:.75rem;letter-spacing:.05em;color:var(--muted)}

.grid-background{position:fixed;inset:0;z-index:1;opacity:.15}

/* Intro morph transition */
.content-intro.transitioning{pointer-events:none}
.content-intro.transitioning .fade{transition:none;opacity:0}
.content-intro.transitioning .shape-wrap{transform:translateY(-100%);transition:transform 1.2s cubic-bezier(.76,0,.24,1)}

@media(max-width:768px){
  html,body{overflow-y:auto;min-height:100dvh}
  .content-title{font-size:2rem}
  .content-subtitle{font-size:.95rem}
  #card{padding:32px 20px;margin:20px;width:90%}
  #card ul{flex-direction:column}
  #card li a{width:100%}
  #card li a{flex-direction:row;justify-content:flex-start;gap:12px}
}
</style>

<script>
/* ============ Page Transition Logic ============ */
// Load the main animation logic from SimonAKing's repo
function loadScript(url){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s);})}

loadScript('https://cdn.jsdelivr.net/gh/SimonAKing/HomePage@master/src/js/main.js').then(()=>{
  console.log('%c xixia666 %c Homepage %c Inspired by SimonAKing/HomePage %c',
    'background:#222325;color:#fff;padding:4px 12px;border-radius:4px 0 0 4px',
    'background:#fff;color:#222325;padding:4px 12px;font-weight:bold',
    'background:transparent;color:rgba(255,255,255,.6);padding:4px 12px;border-radius:0 4px 4px 0',
    '');
}).catch(()=>{
  // Fallback transition if main.js fails to load
  console.log('Fallback mode: main.js CDN unavailable');
  const intro=document.getElementById('intro');
  const main=document.getElementById('main');
  const enterBtn=document.getElementById('enterBtn');
  const fadeElements=intro.querySelectorAll('.fade');

  // Intro entrance animation
  setTimeout(()=>{
    anime.timeline({easing:'easeOutQuart'})
      .add({targets:fadeElements,opacity:[0,1],duration:600,delay:anime.stagger(200)})
      .add({targets:'.content-title',opacity:[0,1],translateY:[20,0],duration:800},'-=400')
      .add({targets:'.content-subtitle',opacity:[0,1],translateY:[20,0],duration:800},'-=600')
      .add({targets:'.enter',opacity:[0,1],translateY:[20,0],duration:800},'-=600')
      .add({targets:'.github-corner',opacity:[0,1],duration:600},'-=800');
  },300);

  // Enter click → morph transition
  if(enterBtn){
    enterBtn.addEventListener('click',()=>{
      const morphPath=document.getElementById('morphPath');
      const introEl=document.getElementById('intro');

      // Fade out intro content
      anime({
        targets:[introEl.querySelector('.content-inner'),introEl.querySelector('.github-corner')],
        opacity:0,
        duration:400,
        easing:'easeOutQuad'
      });

      // Morph the SVG path to reveal main screen
      anime({
        targets:{val:0},
        val:1,
        duration:1200,
        easing:'easeInQuart',
        update:function(anim){
          const p=anim.animations[0].currentValue;
          // Slide shape up
          introEl.style.transform=`translateY(${-p*100}%)`;
          introEl.style.opacity=String(1-p);
        }
      });

      // Fade in main card
      setTimeout(()=>{
        introEl.style.display='none';
        main.style.opacity='1';
        anime.timeline({easing:'easeOutQuart'})
          .add({targets:'#card',opacity:[0,1],translateY:[30,0],duration:800})
          .add({targets:'#card img',opacity:[0,1],scale:[0.5,1],duration:600,delay:anime.stagger(100)},'-=600')
          .add({targets:'#card h1',opacity:[0,1],translateY:[20,0],duration:600},'-=400')
          .add({targets:'#card h2',opacity:[0,1],translateY:[20,0],duration:600},'-=500')
          .add({targets:'#card li',opacity:[0,1],translateY:[20,0],duration:600,delay:anime.stagger(100)},'-=500')
          .add({targets:'#gridCanvas',opacity:[0,0.15],duration:1000},'-=800');
        drawGrid();
      },600);
    });
  }

  // Grid background animation
  function drawGrid(){
    const canvas=document.getElementById('gridCanvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    let W,H;
    function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
    resize();
    window.addEventListener('resize',resize);
    let offset=0;
    function animate(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,0.08)';
      ctx.lineWidth=1;
      const gap=40;
      offset=(offset+0.3)%gap;
      for(let x=-gap+offset;x<W+gap;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=-gap+offset;y<H+gap;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      requestAnimationFrame(animate);
    }
    animate();
  }
});
</script>
