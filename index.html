<title>xixia666</title>
<style>
/* ========== RESET ========== */
:root{
  --bg:#222325; --text:#fff; --muted:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.04); --glass-border:rgba(255,255,255,.08);
  --c1:#4a90d9; --c2:#7b68ee; --c3:#ff6b6b; --c4:#f0a050;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;color:var(--text)}
a{color:inherit;text-decoration:none}
ul{list-style:none}

/* ========== ANIMATED BG ========== */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;mix-blend-mode:screen}
.aurora .b1{width:600px;height:600px;left:-10%;top:-15%;background:var(--c1);animation:drift1 18s infinite ease-in-out}
.aurora .b2{width:500px;height:500px;right:-8%;top:10%;background:var(--c2);animation:drift2 22s infinite ease-in-out}
.aurora .b3{width:450px;height:450px;left:30%;bottom:-10%;background:var(--c3);animation:drift3 20s infinite ease-in-out}
.aurora .b4{width:380px;height:380px;right:25%;bottom:5%;background:var(--c4);animation:drift4 16s infinite ease-in-out}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60%,40%) scale(1.2)}66%{transform:translate(30%,70%) scale(.8)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50%,30%) scale(1.3)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40%,-50%) scale(1.1)}}
@keyframes drift4{0%,100%{transform:translate(0,0) scale(.9)}50%{transform:translate(-30%,-30%) scale(1.2)}}

/* Grid overlay */
.grid-overlay{position:fixed;inset:0;z-index:1;opacity:.06;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:50px 50px;animation:gridPan 30s linear infinite}
@keyframes gridPan{0%{background-position:0 0}100%{background-position:50px 50px}}

/* Vignette */
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 0%,rgba(34,35,37,.3) 70%,rgba(34,35,37,.7) 100%)}

/* ========== INTRO SCREEN ========== */
.intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  transition:transform 1s cubic-bezier(.76,0,.24,1),opacity 1s cubic-bezier(.76,0,.24,1)}
.intro:target{transform:translateY(-100%);opacity:0;pointer-events:none}

.intro-inner{text-align:center;position:relative;z-index:10}
.intro-inner > *{opacity:0;animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards}
.intro-inner .title{animation-delay:.2s}
.intro-inner .subtitle{animation-delay:.5s}
.intro-inner .enter-link{animation-delay:.8s}
.intro-inner .github-corner{animation-delay:0s}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* GitHub corner */
.github-corner{position:fixed;top:0;right:0;z-index:15;opacity:1;transition:opacity .4s ease}
.github-corner svg{width:80px;height:80px;fill:rgba(34,35,37,.5);color:#fff;position:absolute;top:0;right:0;border:0}
.github-corner:hover .octo-arm{animation:octowave 560ms ease-in-out}
@keyframes octowave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}
@media(max-width:500px){.github-corner .octo-arm{animation:octowave 560ms ease-in-out}}

/* Intro content */
.content-title{font-size:clamp(2.2rem,7vw,4rem);font-weight:700;letter-spacing:.02em;margin-bottom:.5rem}
.content-subtitle{font-size:clamp(.95rem,2vw,1.15rem);font-weight:300;color:var(--muted);margin-bottom:2.5rem}
.enter-link{display:inline-flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:opacity .3s ease}
.enter-link:hover{opacity:.7}
.enter-link .enter-text{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.enter-link .arrow{width:1px;height:28px;background:var(--muted);position:relative;overflow:hidden}
.enter-link .arrow::after{content:'';position:absolute;top:0;left:0;width:100%;height:50%;background:#fff;animation:arrowSlide 1.5s infinite ease-in-out}
.enter-link .arrow:nth-child(3)::after{animation-delay:.3s}
@keyframes arrowSlide{0%{transform:translateY(-100%)}100%{transform:translateY(200%)}}

/* Shape wave at bottom */
.shape-wave{position:fixed;bottom:0;left:0;width:100%;z-index:3;pointer-events:none;line-height:0}
.shape-wave svg{width:100%;height:25vh;display:block}
.shape-wave path{fill:var(--bg);transition:transform 1s cubic-bezier(.76,0,.24,1)}

/* ========== MAIN SCREEN ========== */
.main{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .8s ease;pointer-events:none}
.intro:target ~ .main{opacity:1;pointer-events:auto}

.card{position:relative;text-align:center;padding:48px 36px;border-radius:24px;
  transform:translateY(30px);transition:transform .8s cubic-bezier(.16,1,.3,1) .3s}
.intro:target ~ .main .card{transform:translateY(0)}
.card::before{content:'';position:absolute;inset:0;border-radius:24px;
  background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-border)}
.card-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}

.card img{width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,255,255,.12);object-fit:cover;
  opacity:0;transform:scale(.5);transition:all .6s cubic-bezier(.16,1,.3,1) .5s}
.intro:target ~ .main .card img{opacity:1;transform:scale(1)}

.card h1{font-size:1.6rem;font-weight:600;letter-spacing:.01em;
  opacity:0;transform:translateY(16px);transition:all .5s cubic-bezier(.16,1,.3,1) .6s}
.intro:target ~ .main .card h1{opacity:1;transform:translateY(0)}

.card h2{font-size:.95rem;font-weight:300;color:var(--muted);
  opacity:0;transform:translateY(16px);transition:all .5s cubic-bezier(.16,1,.3,1) .7s}
.intro:target ~ .main .card h2{opacity:1;transform:translateY(0)}

.card ul{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center;
  opacity:0;transition:opacity .5s ease .9s}
.intro:target ~ .main .card ul{opacity:1}

.card li{transform:translateY(16px);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.intro:target ~ .main .card li:nth-child(1){transition-delay:.9s}
.intro:target ~ .main .card li:nth-child(2){transition-delay:1s}
.intro:target ~ .main .card li:nth-child(3){transition-delay:1.1s}
.intro:target ~ .main .card li:nth-child(4){transition-delay:1.2s}
.intro:target ~ .main .card li{transform:translateY(0)}

.card li a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 20px;
  border-radius:14px;background:var(--glass);border:1px solid var(--glass-border);
  min-width:84px;transition:all .3s ease}
.card li a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);transform:translateY(-4px)}
.card li a:active{transform:scale(.97)}
.card li a svg{width:28px;height:28px;fill:var(--text);opacity:.85}
.card li a span{font-size:.72rem;letter-spacing:.05em;color:var(--muted)}

/* Back button */
.back-link{position:absolute;top:24px;left:24px;z-index:10;
  display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);
  opacity:0;transition:opacity .4s ease 1.4s;cursor:pointer}
.intro:target ~ .main .back-link{opacity:1}
.back-link:hover{color:#fff}
.back-link svg{width:16px;height:16px}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  html,body{overflow-y:auto;min-height:100dvh}
  .content-title{font-size:2rem}
  .content-subtitle{font-size:.9rem}
  .card{padding:32px 20px;margin:16px;width:92%;max-width:380px}
  .card ul{flex-direction:column;width:100%}
  .card li a{width:100%;flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 18px}
  .github-corner svg{width:60px;height:60px}
}
</style>
</head>
