<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=2">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-status-bar-style" content="#1a1a2e">
  <meta name="description" content="SKY·紫罗兰 — Android 悬浮球工具">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/75162629?v=4" type="image/x-icon">
  <title>SKY·紫罗兰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body id="page-top" class="site-loading">

  <svg class="shape" style="display:none"><path></path></svg>

  <!-- ====== 首屏 ====== -->
  <section class="content-intro" id="intro">
    <canvas id="background"></canvas>
    <div class="content-inner">
      <div class="fade">
        <h2 class="content-title" id="intro-title"></h2>
        <h3 class="content-subtitle" id="intro-subtitle"></h3>
        <a class="enter" id="enterBtn">
          <div class="arrow arrow-1"></div>
          <div class="arrow arrow-2"></div>
        </a>
      </div>
    </div>
    <div class="shape-wrap">
      <svg width="100%" height="100vh" preserveAspectRatio="none" viewBox="0 0 1440 800">
        <path id="morphPath" d="M -44,-50 C -52.71,28.52 15.86,8.186 184,14.69 383.3,22.39 462.5,12.58 638,14 835.5,15.6 987,6.4 1194,13.86 1661,30.68 1652,-36.74 1582,-140.1 1512,-243.5 15.88,-589.5 -44,-50 Z"></path>
      </svg>
    </div>
  </section>

  <!-- ====== 主屏 ====== -->
  <section class="content-main" id="main">
    <nav class="top-nav" id="topNav">
      <div class="nav-inner">
        <a class="nav-brand" href="#page-top" id="nav-brand"></a>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="nav-links" id="nav-links"></div>
      </div>
    </nav>
    <div class="card-wrap">
      <div class="fade" id="card">
        <div class="card-inner">
          <img id="card-avatar" src="" alt="头像" width="100" height="100">
          <h1 id="card-name"></h1>
          <h2 id="card-signature"></h2>
          <ul id="card-links"></ul>
        </div>
      </div>
    </div>
    <main id="sections"></main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span id="copyright"></span>
        <div class="footer-links" id="footer-links"></div>
      </div>
    </footer>
  </section>

  <script>
    window.config = {
      SIM_RESOLUTION: 128, DYE_RESOLUTION: 1024, CAPTURE_RESOLUTION: 512,
      DENSITY_DISSIPATION: 1, VELOCITY_DISSIPATION: 0.2, PRESSURE: 0.8,
      PRESSURE_ITERATIONS: 20, CURL: 30, SPLAT_RADIUS: 0.25, SPLAT_FORCE: 6000,
      SHADING: true, COLORFUL: true, COLOR_UPDATE_SPEED: 10, PAUSED: false,
      BACK_COLOR: { r: 26, g: 26, b: 46 }, TRANSPARENT: false,
      BLOOM: true, BLOOM_ITERATIONS: 8, BLOOM_RESOLUTION: 256, BLOOM_INTENSITY: 0.4,
      BLOOM_THRESHOLD: 0.8, BLOOM_SOFT_KNEE: 0.7,
      SUNRAYS: true, SUNRAYS_RESOLUTION: 196, SUNRAYS_WEIGHT: 1.0
    };
    var visibilityChangeEvent = 'visibilitychange';
    var switchPage = { switched: false };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/SimonAKing/HomePage@master/src/js/background.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
